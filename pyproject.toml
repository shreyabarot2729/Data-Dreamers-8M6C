[project]
name = "event-registration-system"
version = "0.1.0"
description = "Secure event registration and check-in system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "pydantic[email]>=2.9,<3.0",
  "qrcode[pil]>=7.4,<8.0",
  "httpx>=0.27,<1.0",
  "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "aiosqlite>=0.20,<1.0",
  "ruff>=0.6,<1.0",
]
local-face = [
  "opencv-contrib-python-headless>=4.10,<5.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
